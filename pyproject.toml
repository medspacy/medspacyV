[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "medspacyV"
version = "1.1.0"
description = "A visual desktop interface for the medspacy clinical NLP pipeline"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
keywords = ["medspacy", "nlp", "clinical", "ner", "gui"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Healthcare Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pandas>=2.0.3",
    "numpy>=1.24.4",
    "medspacy>=1.2.0",
    "spacy>=3.5.4",
    "openpyxl>=3.1.3",
    "pillow>=10.4.0",
    "regex>=2024.5.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
build = [
    "pyinstaller==5.13.2",
    "py-splash>=0.4.5",
]

[project.urls]
Homepage = "https://github.com/medspacy/medspacyV"
Repository = "https://github.com/medspacy/medspacyV"
Issues = "https://github.com/medspacy/medspacyV/issues"

[tool.setuptools.packages.find]
include = ["helper*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line too long — handled gradually
    "F401",  # unused imports — too many commented-out imports in codebase
    "F841",  # unused variables — exists in core files we do not lint
]
exclude = ["application/", "__pycache__/"]

[tool.mypy]
python_version = "3.8"
ignore_missing_imports = true
exclude = ["application/", "tests/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "unit: pure unit tests, no I/O",
    "integration: tests that read from disk",
]
